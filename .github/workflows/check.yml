name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.8@sha256:a64b0319f4aad1069f2edd587f9d4d7bf2c52318c3c3e0c9d88650c5983c9c77
      # Use UID 1001 to match GitHub-hosted runner workspace ownership.
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          goneat version
          yamlfmt --version
          yamllint --version
          prettier --version
          jq --version
          yq --version
          rg --version

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          make check

      - name: Verify formatting (no changes)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code || (echo "Formatting changed files. Run 'make fmt' and commit." && exit 1)

  windows:
    # Contract checks on Windows catch path-separator and file-permission
    # differences that the Linux container cannot.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve repository LF bytes
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install prerequisites
        shell: pwsh
        run: choco install make jq --yes --no-progress

      - name: Install verified sfetch and goneat
        env:
          # sfetch uses this only for GitHub API requests.
          SFETCH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bin
          # Repository controls call python3; setup-python provides python.exe.
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > bin/python3
          make bootstrap-release-tools BIN_DIR="$(pwd)/bin"
          cygpath -w "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Run contract checks
        run: make check-contracts BIN_DIR="$(pwd)/bin"

      - name: Verify no tracked changes
        run: git diff --exit-code
